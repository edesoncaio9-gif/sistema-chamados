<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" href="imagens/Brasao.png">
  <meta charset="UTF-8">
  <title>Login Atendente</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="page-login">
  <div class="login-container">
    <h2>PAINEL DO ATENDENTE</h2>
    <form id="loginForm">
      <input type="text" id="usuario" placeholder="Usuário" required>
      <input type="password" id="senha" placeholder="Senha" required>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div class="error" id="erroMsg"></div>
    </form>
   
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      
      const usuario = document.getElementById('usuario').value;
      const senha = document.getElementById('senha').value;
      const erroMsg = document.getElementById('erroMsg');

      if(usuario === 'admimplurb' && senha === 'manausK7c2012'){
        window.location.href = 'painel_atendente.html';

      } else {
        erroMsg.textContent = 'Usuário ou senha incorretos!';
      }
    });
  </script>
</body>
</html>
