<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="imagens/Brasao.png">
<title>CHAMAR</title>
<link rel="stylesheet" href="style.css" />
<style>
/* Status chips */
.status-chip {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  line-height: 18px; border: 1px solid transparent;
}
.status-aberto { background-color: #e9ecef; color: #343a40; }
.status-em-andamento { background-color: #fff3cd; color: #664d03; }
.status-aguardando-pecas { background-color: #f8d7da; color: #842029; }
.status-resolvido { background-color: #198754; color: white; }

/* Layout geral */
body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; height: 100%; }
.header {
  background-image: url(imagens/logo\ a\ esquerda.png);
  background-size: cover; background-repeat: no-repeat; background-position: center;
  min-height: 100vh; display: flex; justify-content: center; align-items: center;
  padding: 20px; box-sizing: border-box;
}
.content-box {
  margin-left: 220px; margin-bottom: 110px; display: flex; flex-direction: column; align-items: center;
  background-color: rgba(255,255,255,0.9); padding: 30px; border-radius: 10px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3); width: 90%; max-width: 400px;
}
.form-container { width: 100%; }
.form-container h1 { text-align: center; margin-bottom: 20px; font-size: 20px; }
.form-container label { display: block; margin-top: 10px; }
.form-container input, .form-container select, .form-container textarea, .form-container button {
  width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px;
}
.form-container textarea { resize: vertical; min-height: 80px; }
.form-container button { background-color: #007BFF; color: white; border: none; margin-top: 15px; cursor: pointer; font-weight: bold; }
.form-container button:hover { background-color: #0056b3; }

/* Fila de chamados */
#fila-container {
  margin-top: 20px; width: 100%; background-color: #f1f1f1;
  padding: 10px; border-radius: 8px; max-height: 340px; overflow-y: auto; display: none;
}
#fila-container h2 { text-align: center; margin-bottom: 10px; }
#fila-chamados li {
  margin-right: 24px;
  margin-bottom: 8px; padding: 8px 10px; background-color: white; border-radius: 8px; list-style: none;
  box-shadow: 0 0 3px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 4px;
}

.top-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta { font-size: 12px; color: #555; }

@media(max-width: 600px) { .content-box { max-width: 95%; padding: 20px; } }
</style>
</head>
<body>
<div class="header">
<div class="content-box">
<div class="form-container">
<h1>ABERTURA DE CHAMADO</h1>
<form id="chamadoForm">
  <label for="usuario">Usuário:</label>
  <select id="usuario" name="usuario" required></select>
  <input type="text" id="novo-usuario" placeholder="Digite seu nome" style="display:none;" />

  <label for="setor">Setor:</label>
  <select id="setor" name="setor" required></select>

  <label for="equipamento">Equipamento:</label>
  <select id="equipamento" name="equipamento" required></select>

  <label for="problema">Problema:</label>
  <textarea id="problema" name="problema" placeholder="detalhe sobre o problema" required rows="4" cols="50"></textarea>

  <button type="submit">Enviar Chamado</button>

  <div style="text-align:center; margin-top: 15px;">
    <button type="button" onclick="window.location.href='login.html'"
      style="background-color: #6c757d; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer;">
      Sou Atendente
    </button>
  </div>
</form>

<div style="text-align:center; margin-top: 20px;">
  <button id="ver-fila" style="background-color:#28a745; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;">
    Ver fila de chamados
  </button>
</div>

<div id="fila-container">
  <h2>Fila de Chamados</h2>
  <ul id="fila-chamados"></ul>
</div>
</div>
</div>
</div>

<script>
// Helpers
function formatarData(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('pt-BR');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

function classeStatus(status) {
  const s = (status || '').toLowerCase();
  if (s === 'em andamento') return 'status-em-andamento';
  if (s === 'aguardando peças' || s === 'aguardando pecas') return 'status-aguardando-pecas';
  if (s === 'resolvido') return 'status-resolvido';
  return 'status-aberto';
}

// Carrega dados base (setores, equipamentos e usuários)
async function carregarDadosBase() {
  try {
    const response = await fetch('/dados_base', { cache: 'no-store' });
    const dados = await response.json();

    // Usuários
    const usuarioSelect = document.getElementById('usuario');
    const inputNovoUsuario = document.getElementById('novo-usuario');
    usuarioSelect.innerHTML = '';

const placeholderOpt = document.createElement('option');
placeholderOpt.value = '';
placeholderOpt.textContent = 'SELECIONE O USUÁRIO';
placeholderOpt.disabled = true;
placeholderOpt.selected = true;
usuarioSelect.appendChild(placeholderOpt);

  dados.usuarios
  .sort((a, b) => a.localeCompare(b, 'pt-BR'))
  .forEach(u => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    usuarioSelect.appendChild(opt);
    });
    // Adiciona opção "novo usuário"
    const novoOpt = document.createElement('option');
    novoOpt.value = 'novo_usuario';
    novoOpt.textContent = 'MEU NOME NÃO CONSTA NA LISTA';
    usuarioSelect.appendChild(novoOpt);

    usuarioSelect.addEventListener('change', () => {
      if (usuarioSelect.value === 'novo_usuario') {
        inputNovoUsuario.style.display = 'block';
      } else {
        inputNovoUsuario.style.display = 'none';
      }
    });

    // Setores
    const setorSelect = document.getElementById('setor');
    setorSelect.innerHTML = '';
    Object.keys(dados.setores_responsaveis).forEach(setor => {
      const opt = document.createElement('option');
      opt.value = setor;
      opt.textContent = setor;
      setorSelect.appendChild(opt);
    });

    // Equipamentos
    const equipamentoSelect = document.getElementById('equipamento');
    equipamentoSelect.innerHTML = '';
    dados.equipamentos.forEach(eq => {
      const opt = document.createElement('option');
      opt.value = eq;
      opt.textContent = eq;
      equipamentoSelect.appendChild(opt);
    });

  } catch (erro) {
    console.error('Erro ao carregar dados_base:', erro);
  }
}

document.addEventListener('DOMContentLoaded', carregarDadosBase);

// Enviar chamado
document.getElementById('chamadoForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const usuarioSelect = document.getElementById('usuario');
  const inputNovoUsuario = document.getElementById('novo-usuario');
  let usuario = usuarioSelect.value;

  // Se for novo usuário
  if (usuario === 'novo_usuario') {
   let novoNome = inputNovoUsuario.value.trim().toUpperCase();
    if (!novoNome) return alert('Digite seu nome');

    try {
      const respUsuario = await fetch('/usuarios', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: novoNome })
      });

      if (!respUsuario.ok) {
        const errData = await respUsuario.json();
        throw new Error(errData.erro || 'Erro ao adicionar usuário');
      }

      usuario = novoNome;
      inputNovoUsuario.style.display = 'none';

      // Atualiza apenas o select de usuários
      const usuariosAtualizados = await (await fetch('/usuarios')).json();
      usuarioSelect.innerHTML = '';
      usuariosAtualizados.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        usuarioSelect.appendChild(opt);
      });
      // Mantém o novo usuário selecionado
      usuarioSelect.value = novoNome;

    } catch (err) {
      return alert('Falha ao registrar usuário: ' + err.message);
    }
  }

  const setor = document.getElementById('setor').value;
  const equipamento = document.getElementById('equipamento').value;
  const problema = document.getElementById('problema').value;

  const chamado = { usuario, setor, equipamento, problema };

  try {
    const resp = await fetch('/chamados', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(chamado)
    });

    if (!resp.ok) throw new Error('Erro ao salvar chamado');

    alert('Chamado registrado com sucesso!');
    document.getElementById('chamadoForm').reset();

  } catch (err) {
    alert('Falha ao registrar chamado: ' + err.message);
  }
});

// Renderiza a fila de chamados
async function renderizarFilaChamados() {
  try {
    const resposta = await fetch('/fila-chamados?_=' + Date.now(), { cache: 'no-store' });
    const fila = await resposta.json();

    const container = document.getElementById('fila-container');
    const ul = document.getElementById('fila-chamados');
    ul.innerHTML = '';

    fila.forEach((chamado, index) => {
      const li = document.createElement('li');

      const top = document.createElement('div');
      top.className = 'top-row';
      top.innerHTML = `
        <strong>${index + 1}.</strong>
        <span>${escapeHtml(chamado.usuario)}</span>
        <span>— ${escapeHtml(chamado.setor)}</span>
        <span>— ${escapeHtml(chamado.equipamento)}</span>
        <span class="status-chip ${classeStatus(chamado.status)}">${escapeHtml(chamado.status || 'Aberto')}</span>
      `;

      const meta = document.createElement('div');
meta.className = 'meta';

let html = '';
if (chamado.dataAbertura) {
  html += `Aberto em: ${formatarData(chamado.dataAbertura)}`;
}
if (chamado.dataFinalizacao) {
  html += `<br>Resolvido em: ${formatarData(chamado.dataFinalizacao)}`;
}

meta.innerHTML = html;

      
      const problema = document.createElement('div');
      problema.className = 'meta';
      problema.textContent = `Problema: ${chamado.problema || ''}`;

      li.appendChild(top);
      li.appendChild(meta);
      li.appendChild(problema);

      ul.appendChild(li);
    });

    if (fila.length > 0) container.style.display = 'block';

  } catch (erro) {
    console.error('Erro ao carregar fila de chamados:', erro);
  }
}

// Botão "Ver fila"
document.getElementById('ver-fila').addEventListener('click', async () => {
  const container = document.getElementById('fila-container');
  if (container.style.display === 'block') {
    container.style.display = 'none';
  } else {
    await renderizarFilaChamados();
    container.style.display = 'block';
  }
});

</script>
